spring.application.name=backend
server.port=8080

# Default to localhost:5433 for local dev, but Docker Compose will override this
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/aliagri}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aliagri}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect