<div class="dashboard-header">
  <div>
    <h2 class="page-title">Dashboard</h2>
    <p class="subtitle">Welcome back! Here's your farm overview.</p>
  </div>
</div>

<!-- Stats Grid -->
<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-header">
      <span class="stat-title">Total Revenue</span>
      <div class="icon-wrapper green"><lucide-icon [img]="TrendingUp" size="20"></lucide-icon></div>
    </div>
    <div class="stat-value">28,000 DH</div>
    <div class="stat-trend positive">+12.5% <span>vs last month</span></div>
  </div>

  <div class="stat-card">
    <div class="stat-header">
      <span class="stat-title">Inventory Items</span>
      <div class="icon-wrapper blue"><lucide-icon [img]="Package" size="20"></lucide-icon></div>
    </div>
    <div class="stat-value">148</div>
    <div class="stat-trend positive">+5 new <span>this week</span></div>
  </div>

  <div class="stat-card">
    <div class="stat-header">
      <span class="stat-title">Total Sales</span>
      <div class="icon-wrapper orange"><lucide-icon [img]="ShoppingCart" size="20"></lucide-icon></div>
    </div>
    <div class="stat-value">342</div>
    <div class="stat-trend positive">+8 <span>this week</span></div>
  </div>

  <div class="stat-card">
    <div class="stat-header">
      <span class="stat-title">Active Alerts</span>
      <div class="icon-wrapper red"><lucide-icon [img]="AlertCircle" size="20"></lucide-icon></div>
    </div>
    <div class="stat-value">3</div>
    <div class="stat-trend warning">Low stock warnings</div>
  </div>
</div>

<!-- Charts Area (Placeholder for now) -->
<div class="charts-grid">
  <div class="card chart-card">
    <h3 class="card-title">Revenue Trend</h3>
    <div class="chart-placeholder">
      <p>Chart will go here</p>
    </div>
  </div>
  <div class="card chart-card">
    <h3 class="card-title">Top Products</h3>
    <div class="chart-placeholder">
      <p>Chart will go here</p>
    </div>
  </div>
</div>
