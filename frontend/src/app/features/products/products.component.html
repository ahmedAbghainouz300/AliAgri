<!-- Page Header -->
<div class="d-flex justify-content-between align-items-center mb-4" style="flex-wrap: wrap; gap: 16px;">
  <div>
    <div class="text-muted fw-bold"
      style="letter-spacing: 0.05em; text-transform: uppercase; font-size: 11px; margin-bottom: 2px;">Catalogue</div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em;">Produits</h1>
  </div>
  <div class="d-flex gap-3">
    <button class="btn btn-secondary" style="height: 38px; padding: 0 16px;">Exporter</button>
    <button class="btn btn-primary" style="height: 38px; padding: 0 16px;" (click)="showAddModal()">
      + Nouveau produit
    </button>
  </div>
</div>

<!-- KPI Cards -->
<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px;">
  <div class="card" style="padding: 16px; display: flex; align-items: center; gap: 12px;">
    <div
      style="width: 36px; height: 36px; border-radius: 10px; background: var(--color-background); display: flex; align-items: center; justify-content: center; font-size: 18px;">
      📦
    </div>
    <div>
      <div style="font-size: 12px; color: var(--color-text-secondary); font-weight: 600;">Total produits</div>
      <div style="font-size: 20px; font-weight: 800; line-height: 1.2;">{{ products.length }}</div>
    </div>
  </div>
</div>

<!-- Main Table Card -->
<div class="card p-0" style="overflow: hidden;">

  <!-- Table Toolbar -->
  <div
    style="padding: 16px 20px; border-bottom: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;">
    <input type="text" class="form-control" placeholder="Nom ou numéro de licence..."
      style="width: 300px; height: 38px;" [(ngModel)]="searchText">

    <div style="display: flex; gap: 8px;">
      <button
        style="height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #0E3B2B; background: #0E3B2B; color: white; font-size: 13px; font-weight: 600;">Tous</button>
      <button
        style="height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #D5D9CF; background: white; color: #33443B; font-size: 13px; font-weight: 600;">Disponible</button>
      <button
        style="height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #D5D9CF; background: white; color: #33443B; font-size: 13px; font-weight: 600;">Stock
        faible</button>
      <button
        style="height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #D5D9CF; background: white; color: #33443B; font-size: 13px; font-weight: 600;">En
        rupture</button>
    </div>
  </div>

  <!-- Table -->
  <table>
    <thead>
      <tr>
        <th>Produit</th>
        <th>Quantité</th>
        <th>Statut</th>
        <th style="text-align: right;">Actions</th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngIf="!loading">
        <tr app-product-row *ngFor="let p of filteredProducts" [product]="p" (edit)="showEditModal($event)"
          (delete)="confirmDelete($event)"></tr>
      </ng-container>
      <tr *ngIf="loading">
        <td colspan="4" style="text-align: center; padding: 30px;">Chargement...</td>
      </tr>
      <tr *ngIf="!loading && filteredProducts.length === 0">
        <td colspan="4" style="text-align: center; padding: 40px; color: var(--color-text-muted);">
          Aucun produit trouvé.
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Footer -->
  <div
    style="padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--color-text-secondary);">
    <span>{{ products.length }} produit{{ products.length > 1 ? 's' : '' }} sur {{ products.length }}</span>
    <div class="d-flex gap-2">
      <button class="btn btn-secondary btn-sm" disabled>Précédent</button>
      <button class="btn btn-secondary btn-sm" disabled>Suivant</button>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<p-dialog [header]="isEditing ? 'Modifier le produit' : 'Ajouter un produit'" [(visible)]="displayModal" [modal]="true"
  [style]="{ width: '550px' }" [draggable]="false" [resizable]="false" styleClass="premium-dialog">

  <div class="modal-form">

    <div class="form-group">
      <label>Nom du produit</label>
      <input type="text" pInputText [(ngModel)]="newProduct.name" placeholder="Ex. Pesticide Alpha" />
    </div>

    <div class="form-group">
      <label>Numéro de licence</label>
      <input type="text" pInputText [(ngModel)]="newProduct.licenseNumber" placeholder="Ex. LIC-123" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Catégorie</label>
        <p-dropdown [options]="categories" [(ngModel)]="newProduct.categoryId" optionLabel="name" optionValue="id"
          placeholder="Choisir une catégorie" styleClass="aliagri-select" panelStyleClass="aliagri-select-panel"
          appendTo="body">
        </p-dropdown>
      </div>

      <div class="form-group">
        <label>Unité</label>
        <p-dropdown [options]="units" [(ngModel)]="newProduct.unitId" optionLabel="name" optionValue="id"
          placeholder="Choisir une unité" styleClass="aliagri-select" panelStyleClass="aliagri-select-panel"
          appendTo="body">
        </p-dropdown>
      </div>
    </div>

    <div class="form-group">
      <label>Quantité en stock</label>
      <input type="number" pInputText [(ngModel)]="newProduct.stockQuantity" />
    </div>

  </div>

  <ng-template pTemplate="footer">
    <div class="dialog-footer">
      <button class="btn btn-secondary" (click)="displayModal = false">Annuler</button>
      <button class="btn btn-primary" (click)="saveProduct()">Enregistrer</button>
    </div>
  </ng-template>
</p-dialog>

<p-confirmDialog></p-confirmDialog>
