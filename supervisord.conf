[supervisord]
nodaemon=true

[program:postgres]
command=postgres -D /var/lib/postgresql/data
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:backend]
command=java -jar /app/app.jar
environment=SPRING_DATASOURCE_URL="jdbc:postgresql://localhost:5432/aliagri",SPRING_DATASOURCE_USERNAME="aliagri",SPRING_DATASOURCE_PASSWORD="AliAgri2015"
autostart=true
autorestart=true
priority=20
startsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0